name: Football odds snapshots

# Records Singapore Pools' 1X2 odds for every validated-league fixture kicking off
# within the next 10 days, every ~3 hours, to
# notebooks/football_betting/output/odds_history.csv -- so we can see how the odds
# move as kickoff approaches and whether betting closer to the game gets better
# prices (report: notebooks/football_betting/odds_drift_report.py).
#
# GitHub's scheduler is often hours late, so run times are irregular; that is fine,
# every row carries its own timestamp and hours-to-kickoff, and the analysis is by
# hours-to-kickoff rather than clock time. Read-only against the odds feed: never
# places or touches a bet. Lightweight on purpose (no PyTorch / full requirements).
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: football-odds-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install pandas==2.3.3 numpy==2.0.2 requests==2.32.5

      - name: Take odds snapshot
        working-directory: notebooks
        run: python football_betting/odds_snapshot.py

      - name: Rebuild odds tracker page
        working-directory: notebooks
        run: python football_betting/odds_chart.py

      - name: Commit and push
        working-directory: notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add football_betting/output/odds_history.csv football_betting/output/odds_tracker.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Football odds snapshot $(date -u +%Y-%m-%dT%H:%MZ) [automated]"
          # The daily dashboard workflow also pushes to main; if it landed first,
          # merge its commit (they touch different files) and retry.
          for i in 1 2 3 4; do
            if git push origin main; then
              exit 0
            fi
            git pull --no-rebase --no-edit origin main
          done
          echo "Push failed after retries" >&2
          exit 1
