name: Daily CPE dashboard update

# Runs the same steps as notebooks/run_dashboards.sh, minus its broken
# Windows-only conda-activate line. Scheduled to run once a day, target
# ~00:07 UTC (~08:07 SGT), and can also be triggered manually from the
# Actions tab (workflow_dispatch) for testing.
#
# Timing history/diagnosis (see notebooks/ git log for the full story):
# - 2026-09-28, cron "0 3 * * *" (03:00 UTC target): actual run created at
#   09:28:45 UTC -- 6h28m late.
# - 2026-09-29, cron "7 3 * * *" (03:07 UTC target, moved off :00 per
#   GitHub's own congestion-avoidance advice): actual run created at
#   09:42:41 UTC -- 6h35m late. The minute change made no real difference,
#   matching widely-reported 2026 GitHub Actions scheduled-workflow
#   congestion (see e.g. github.com/orgs/community/discussions/201738,
#   /207346, /196910) -- confirmed via createdAt/startedAt from `gh run
#   view --json`, so this is GitHub's own scheduler, not anything in this
#   repo's scripts.
# - 2026-09-30, cron moved to "7 0 * * *" (00:07 UTC target, 3h earlier,
#   still avoiding both :00-minute AND exact-midnight-UTC congestion) --
#   this is a live experiment to tell apart two theories: (a) the delay is
#   a roughly constant ~6.5h offset, in which case an earlier target should
#   land earlier too, or (b) GitHub's queue for this repo/account just
#   clears around a fairly fixed real-world time (~09:30-09:45 UTC)
#   regardless of target, in which case this change won't help. Check the
#   actual createdAt of future schedule-triggered runs to see which held.
#
# This won't guarantee exact timing (GitHub never does). If runs keep
# landing very late no matter the target, that's confirmed GitHub-side
# platform congestion, not something fixable from this repo.
#
# NOT part of this workflow: recording real football bets (record_bet.py)
# or manually resolving a real-money win ahead of official results. Those
# stay a manual, in-chat step whenever the owner reports back -- the
# qualifying picks this run logs are still there to record against
# retroactively.
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-dashboards
  cancel-in-progress: false

jobs:
  run-dashboards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build gold dashboard
        working-directory: notebooks
        run: python build_gold_dashboard.py

      - name: Build portfolio dashboard
        working-directory: notebooks
        run: python build_portfolio_dashboard.py

      - name: Build precious metals dashboard
        working-directory: notebooks
        run: python build_metals_dashboard.py

      - name: Build predictor dashboard
        working-directory: notebooks
        run: python build_predictor_dashboard.py

      - name: Log and score predictor forecasts
        working-directory: notebooks
        run: python predictor_ledger.py

      - name: Log predictions and resolve expired
        working-directory: notebooks
        run: python log_predictions.py --both

      - name: Update IBKR paper ledger
        working-directory: notebooks
        run: python ibkr_paper_ledger.py

      - name: Build football checklist
        working-directory: notebooks
        run: python football_betting/daily_dashboard.py

      - name: Resolve football picks
        working-directory: notebooks
        run: python football_betting/resolve_football_picks.py

      - name: Log CPE signal entry events
        working-directory: notebooks
        run: python cpe_signal_ledger.py

      - name: Build performance monitor
        working-directory: notebooks
        run: python build_performance_monitor.py

      - name: Commit and push
        working-directory: notebooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add gold_predictions.csv portfolio_predictions.csv metals_predictions.csv \
            gold_dashboard.html portfolio_dashboard.html precious_metals_dashboard.html \
            predictor_dashboard.html performance_monitor.html predictor_forecasts.csv cpe_signal_events.csv monitor_history.csv ibkr_paper_ledger.csv multiasset_prices_live_history.parquet \
            football_betting/output/dashboard.html football_betting/output/dashboard_qualifying.json \
            football_betting/output/qualifying_log.csv football_betting/data/matches.parquet \
            football_betting/data/season_cache/*_last_good.parquet
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "CPE daily update $(date -u +%Y-%m-%d) [automated]"
            # football-odds-snapshots.yml also pushes to main every few hours; if it
            # landed between our pull and this push, merge its commit (different
            # files) and retry instead of failing the whole daily run.
            for i in 1 2 3 4; do
              if git push origin main; then
                exit 0
              fi
              git pull --no-rebase --no-edit origin main
            done
            echo "Push failed after retries" >&2
            exit 1
          fi
